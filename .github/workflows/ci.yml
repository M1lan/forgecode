# Minimal CI for this fork. Hand-written and fork-owned.
#
# NOT GENERATED. Upstream generates its workflows from crates/forge_ci; this
# fork does not (see crates/forge_ci/tests/ci.rs, which is now a guard rather
# than a generator). Edit this file directly.
#
# NO `just` IN THIS FILE, EVER. Operator rule. The Justfile is the LOCAL
# developer interface: it needs GNU Bash 5.3+, mise-pinned tools, fzf, gum and
# a warm ~/.cargo, none of which a clean runner has. CI calls cargo directly,
# so what runs here is readable from this file alone and cannot be changed by
# editing a helper script.
#
# WHAT THIS DELIBERATELY DOES NOT DO
# No release matrix, no binary uploads, no npm or homebrew publishing, no
# release drafting, no label syncing, no stale bot, no bounty automation, no
# coverage upload. All of that was upstream's: it publishes to repositories
# this fork cannot write to, using secrets it does not hold, and the two
# cron-driven ones would have churned this fork's own issues and pull
# requests on a schedule.
#
# The real gate is `just ci`, run locally, and it is far stricter than this.
# This workflow exists only so that a push which does not compile is visible
# without a checkout.

name: ci

on:
  push:
    branches:
      - mymain
  pull_request:
    branches:
      - mymain
  workflow_dispatch:

# One person works on this fork, so a superseded run is only burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # crates/forge_repo/build.rs calls tonic_prost_build::compile_protos and
      # prost-build no longer vendors protoc, so this is a hard build dep.
      - name: setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # libsqlite3-sys is pulled in by both diesel and forge_infra, and builds C.
      - name: install system deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # No `toolchain:` input on purpose. Upstream's version passed
      # `toolchain: stable`, which OVERRIDES rust-toolchain.toml -- so the pin
      # said 1.97 while CI silently built on whatever stable happened to be.
      # Omitting it lets the pinned toolchain win.
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: build
        run: cargo build --workspace --locked

      # CI=1 flips crates/forge_config/tests/schema.rs from writing
      # forge.schema.json to asserting it, and crates/forge_ci/tests/ci.rs
      # from generating workflows to checking this file still exists. Without
      # it a test run would rewrite tracked files inside the runner.
      - name: test
        env:
          CI: '1'
        run: cargo test --workspace --locked
