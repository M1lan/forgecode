# betterhook config — forgecode
#
# Dispatch: global core.hooksPath (~/.config/git/hooks) runs
# `betterhook __dispatch` in every repo; this file alone activates hooks here.
# Do NOT `betterhook install` (repo-local wrappers shadow global dispatch).
#
# Lane split: pre-commit = fast (second-scale) gates only; clippy + test live
# on pre-push so agent commit loops stay cheap. Per-worktree CARGO_TARGET_DIR
# isolation keeps parallel agents from corrupting each other's builds.

[meta]
version = 1

[hooks.pre-commit]
parallel = true
fail_fast = false
priority = ["gitleaks", "rustfmt", "shellcheck", "shell-parse"]
# stash_untracked MUST stay false: betterhook stashes to isolate the staged
# tree, and `git stash` during a conflicted merge clears .git/MERGE_HEAD.
# Popping does not restore it, so the commit then dies with
# "fatal: could not open '.git/MERGE_HEAD'" and the merge lineage is lost.
# Verified 2026-08-08 merging agent-maint-justfile into mymain: all four
# pre-commit lanes passed, then the commit aborted. pre-push already
# defaults this to false for the same class of reason.
stash_untracked = false

# EVERY JOB BELOW CALLS A `just` RECIPE. That is deliberate.
#
# These lanes used to re-implement the Justfile inline: the same nightly
# rustfmt PATH dance, the same two shellcheck invocations with the same
# exclude list, the same insta-or-cargo-test fallback. Two copies of one
# policy, free to drift — and they had already drifted, because the hook's
# test lane reproduced the Justfile's silent `cargo test` fallback bug.
#
# The Justfile is now the single source of truth. A gate that passes here
# passes locally, by construction, because it is literally the same command.

# Secrets never land. Fast scan, staged diff only. Stays a builtin: it reads
# the staged diff directly, which no just recipe can do.
[hooks.pre-commit.jobs.gitleaks]
builtin = "gitleaks"

# rustfmt must run the NIGHTLY sysroot — .rustfmt.toml uses unstable features
# (wrap_comments, imports_granularity, …) that stable rustfmt silently
# mis-evaluates (false drift). Verified 2026-07-30: stable flags
# crates/forge_main/src/info.rs:75, nightly fmt-check exit 0 on the same tree.
# builtin = "rustfmt" is the stable channel — do not use it here.
# `just fmt-check` owns that nightly resolution.
[hooks.pre-commit.jobs.rustfmt]
run = "just fmt-check"
glob = ["*.rs", ".rustfmt.toml", "rustfmt.toml"]
isolate = { tool = "cargo", target_dir = "per-worktree" }
timeout = "2m"

# Shell lint, both lanes, via .just/helpers/lint-shell.bash:
#   helpers at -S warning, whole tracked tree at -S error, plus the POSIX
#   installer. The severity split and the SC exclude list live in that
#   helper now, with the reasoning attached.
[hooks.pre-commit.jobs.shellcheck]
run = "just shellcheck"
glob = ["*.bash", "*.sh", "cli"]
reads = ["**/*.bash", "**/*.sh", ".just/**"]
writes = []
concurrent_safe = true

# Parse-check the shell files that get compiled INTO the binary. A syntax
# error in shell-plugin/**/*.zsh is invisible to cargo and only fails at the
# user's shell startup, so it must not reach a commit.
[hooks.pre-commit.jobs.shell-parse]
run = "just test-shell"
glob = ["shell-plugin/**", ".just/helpers/**", "cli"]
reads = ["shell-plugin/**", ".just/**"]
writes = []
concurrent_safe = true

[hooks.pre-push]
parallel = true
fail_fast = false
priority = ["gate"]

# One job, because there is one gate: `just ci-check`.
#
# This lane used to be three jobs (fmt-check, clippy, test) that each
# re-implemented a Justfile recipe. The test one ran `cargo insta test
# --accept`, which WRITES: two of this workspace's four tests/ dirs are
# generators, so a pre-push hook could rewrite .github/workflows/*.yml and
# forge.schema.json underneath the push, and auto-accept every drifted
# snapshot on the way. --check is the read-only form and cannot.
#
# Note it is `ci-check`, not `ci`. `just ci` repairs before it judges, and a
# hook that edits the tree mid-push is a trap. If ci-check fails here, run
# `just ci` by hand, look at what it fixed, and commit that.
[hooks.pre-push.jobs.gate]
run = "just ci-check"
glob = ["*.rs", "Cargo.toml", "Cargo.lock", "*.bash", "*.sh", "*.zsh", "Justfile", ".just/**"]
isolate = { tool = "cargo", target_dir = "per-worktree" }
timeout = "20m"
