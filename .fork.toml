# .fork.toml -- what this fork carries on top of upstream, one entry per patch.
#
# The unit of fork maintenance is the patch (intent, files, drop condition),
# not the commit. This file is the single source of truth for that list.
# docs/fork-differences.md is GENERATED from it: edit here, then `just docs`;
# `just docs-check` (part of `just ci`) fails when the two drift.
#
# No counts and no SHAs here: they rot within days. Derive them from git
# (`git log upstream/main..mymain`, `git cherry -v upstream/main mymain`).
#
# Field contract, per [[patch]]:
#   id           stable slug; commits map to a patch by the files they touch
#                (no commit trailers: AGENTS.md forbids them)
#   title        one line
#   conflict     merge-conflict exposure: none | low | medium | high
#   intent       why the fork carries it (one paragraph, markdown)
#   details      optional longer markdown, rendered verbatim
#   files        git pathspecs the patch owns (files may appear in two patches)
#   upstream_pr  upstream PR URL, "" while none is open
#   upstream_issue  upstream issue URL, "" while none is filed
#   drop_when    the condition under which the patch can be deleted
#   docs         prose that names this patch and must be re-read after a sync

[fork]
name = "forgecode"
vcs = "git"
strategy = "merge" # never rebase mymain by hand; see AGENTS.md "Git Operations"
mirror_branch = "main"
work_branch = "mymain"

[upstream]
url = "https://github.com/tailcallhq/forgecode"
remote = "upstream"
note = "Formerly antinomyhq/forgecode; GitHub redirects the old org."

[origin]
url = "git@github.com:M1lan/forgecode.git"
remote = "origin"

[verify]
quick = "just check"
full = "just ci-check"

[hosts.torque]
path = "~/src/forgecode"
note = "The only working copy. Push origin/mymain only when the operator says so."

[doc]
intro = '''
`mymain` is upstream `main`, as of the last upstream merge into `mymain`,
plus the patches below. How far `mymain` is behind upstream right now is not
recorded here; ask git. This page lists *patches*
(intent, files, drop condition), not commits, and carries no counts: derive
those from git with the commands under
[Reproducing the comparison](#reproducing-the-comparison).
'''
branch_policy = '''
- `upstream/main` is the source of truth for upstream code. Treat the local
  `main` branch as a cached pointer at whatever was last merged; it is not
  automatically current.
- `mymain` is the active development branch. All local work lands here and
  upstream is merged in periodically (`just sync-upstream`, merge, never rebase).
- Push only to `origin`. Contributions intended for upstream go out as pull
  requests from a branch cut off `upstream/main`, not as fork-local patches.
- Fork-only paths (`docs/shell-parity/`, `exec-harness/`, `.beads/`) carry no
  conflict risk. `plans/` is shared with upstream, but the fork only *adds*
  files there and modifies none.
'''

[[patch]]
id = "sdlc-justfile"
title = "Justfile SDLC"
conflict = "none"
intent = '''
Replace upstream's ad-hoc scripts with one `just` task runner (`Justfile` plus
`.just/helpers/*.bash`), mise-pinned tools, typos and betterhook git hooks. One
gate, `just ci`, fixes what is fixable (rustfmt, `clippy --fix`, typos, rumdl,
generated docs) and then re-runs the same tools in check mode; `just ci-check`
is the read-only form the pre-push hook runs.
'''
details = '''
`docs/justfile.md` and `docs/fork-differences.md` are generated
(`just docs`, gated by `just docs-check`). `.forge/commands/check.md` is an
upstream file patched to point agents at `just ci` instead of raw
`cargo fmt`/`clippy`/`insta` calls, which skip the shell, docs and spelling
lanes; it is a very low-churn file. The zsh test helper is renamed
`scripts/test-zsh-utils.sh` -> `.zsh` (it was always zsh; the `.sh` suffix
dragged it into a shellcheck glob that could not read it), one upstream
doc-comment typo in `forge_eventsource_stream` is fixed, and `Cargo.lock` carries targeted
RUSTSEC patches.
'''
files = [
  "Justfile",
  ".just/helpers/",
  "betterhook.toml",
  "mise.toml",
  "typos.toml",
  "docs/justfile.md",
  ".forge/commands/check.md",
  "scripts/test-zsh-utils.zsh",
  "crates/forge_eventsource_stream/src/lib.rs",
  "Cargo.lock",
]
upstream_pr = ""
upstream_issue = ""
drop_when = "Never: local developer interface of this fork. The typo fix drops when upstream fixes it; the RUSTSEC lock bumps drop once the upstream lockfile reaches the same versions."
docs = ["AGENTS.md", "docs/justfile.md"]

[[patch]]
id = "installer"
title = "Installer"
conflict = "low"
intent = '''
`cli` is a forked copy of upstream's POSIX-sh installer. Upstream's
`ensure_install_dir_shell_path()` unconditionally prepended `~/.local/bin` to
`.bashrc` / `.zshrc` on every run, clobbering shell configurations that already
set PATH elsewhere (for example a `path+=()` entry in `~/.zshenv`). The fork
early-returns when the directory is already on `$PATH` or when any common
startup file already references it.
'''
details = '''
`just install` installs both `forge` (release) and `forge-debug`, builds
incrementally, and passes `--locked` to `cargo install` so the lockfile, not a
fresh resolve, decides dependency versions.
'''
files = ["cli", ".just/helpers/install.bash", ".just/helpers/install-audit.bash"]
upstream_pr = ""
upstream_issue = ""
drop_when = "Upstream `cli` stops editing shell RC files when PATH is already set, and upstream install docs use `cargo install --locked`."
docs = ["README.md"]

